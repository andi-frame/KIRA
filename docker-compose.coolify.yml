# Untuk Coolify (Docker Compose build pack). Beda dari docker-compose.prod.yml: tanpa Caddy, karena Coolify sudah punya
# proxy (Traefik) yang memegang port 80/443 dan mengurus sertifikat HTTPS. Domain diisi di tab "Domains" layanan backend.
#
#   Coolify > Docker Compose Location: /docker-compose.coolify.yml
#   Layanan backend > Domains: https://api.contoh-kira.id:8000   (port 8000 = port di dalam kontainer)
#
# Rincian dan daftar variabel: docs/deploy.md
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: kira
    volumes:
      - kira_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Sengaja tanpa "ports": basis data hanya terjangkau dari jaringan internal Compose.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify mengisi ini dari domain yang dipasang pada layanan backend (dengan skema https://).
      SERVICE_URL_BACKEND_8000: ""
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://kira:${POSTGRES_PASSWORD}@db:5432/kira
      JWT_SECRET: ${JWT_SECRET:?}
      PUBLIC_BASE_URL: ${SERVICE_URL_BACKEND_8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-claude-sonnet-5-5}
      LLM_MODEL_EXTRACT: ${LLM_MODEL_EXTRACT:-claude-haiku-5-5}
      LLM_HEDGE_AFTER_SECONDS: ${LLM_HEDGE_AFTER_SECONDS:-18}
      STT_BASE_URL: ${STT_BASE_URL:-https://api.groq.com/openai/v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-large-v3-turbo}
      # Fasilitas kesehatan terdekat: kunci Google Places opsional; tanpa kunci dipakai OpenStreetMap.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      BOT_SECRET: ${BOT_SECRET:-}
      SCHEDULER_ENABLED: "true"
    expose:
      - "8000"
    # HEALTHCHECK sudah ada di backend/Dockerfile (/health/ready), jadi Coolify hanya mengarahkan lalu lintas ke API yang sehat.

  # Jembatan WhatsApp (prototype, tidak resmi). Hapus komentar bila mau dipakai; scan QR dari log layanan ini.
  # wa-bot:
  #   build: ./wa-bot
  #   restart: unless-stopped
