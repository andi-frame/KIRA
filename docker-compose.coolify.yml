  #     - backend
  #   environment:
  #     API_URL: http://backend:8000
  #     AUTH_DIR: /app/auth
  #     BOT_SECRET: ${BOT_SECRET:?}
  #   volumes:
  #     - wa_auth:/app/auth

volumes:
  kira_pg:
