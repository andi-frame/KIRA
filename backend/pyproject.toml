[project]
name = "kira-backend"
version = "0.1.0"
description = "Backend KIRA: FastAPI, graf LangGraph, dan fungsi perhitungan risiko yang bisa diaudit."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "python-multipart>=0.0.20",
    "httpx==0.28.1",
    "langgraph==1.2.15",
    "langchain-core==1.6.10",
    "langchain-anthropic==1.7.6",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
# Bukan paket yang diinstal: app/ dan seed/ dijalankan dari folder backend.
package = false
default-groups = ["dev"]
