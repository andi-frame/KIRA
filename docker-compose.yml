services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira
      POSTGRES_DB: kira
    ports:
      - "5455:5432"
    volumes:
      - kira_pg:/var/lib/postgresql/data
      - ./backend/seed/init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql:ro
volumes:
  kira_pg:
