<!doctype html><html lang="id"><meta charset="utf-8"><title>hasil-tensimeter</title>
<body style="margin:0;background:#b9c4c2;width:900px;height:1000px;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI', 'Figtree', Arial, sans-serif">
<style>.dev{width:560px;background:#f2f4f4;border-radius:44px;padding:36px;box-shadow:0 22px 50px #0005;transform:rotate(-1.5deg)}
.lcd{background:#c7d3bd;border-radius:18px;padding:22px 28px;color:#1a2417;font-family:'Courier New', 'Consolas', monospace;border:6px solid #2d3a30}
.row{display:flex;justify-content:space-between;align-items:baseline} .big{font-size:120px;font-weight:700;line-height:1} .lab{font-size:26px;font-weight:700}
.btn{margin:26px auto 0;width:96px;height:96px;border-radius:50%;background:#0b6e6a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}</style>
<div class="dev">
<div class="lcd">
<div class="row"><span class="lab">SYS<br><small>mmHg</small></span><span class="big">128</span></div>
<div class="row"><span class="lab">DIA<br><small>mmHg</small></span><span class="big">82</span></div>
<div class="row"><span class="lab">PUL<br><small>/min</small></span><span class="big" style="font-size:84px">76</span></div>
</div>
<div class="btn">START</div>
</div></body></html>
